name: Build & Deploy to Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Build ──────────────────────────────────────────────────────────────────
  build:
    name: Build Providers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # If a Nuvio source repo is available, re-run the converter.
      # Otherwise the pre-built dist/ is used as-is.
      - name: Rebuild providers (if nuvio source present)
        run: |
          if [ -d "nuvio-src" ]; then
            echo "Nuvio source found — rebuilding..."
            node convert.js ./nuvio-src ./
          else
            echo "No nuvio-src/ dir — using committed dist/"
          fi

      - name: Verify dist structure
        run: |
          echo "Providers in dist/:"
          ls dist/
          echo ""
          echo "manifest.json:"
          cat manifest.json | python3 -m json.tool --no-ensure-ascii

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  # ── Deploy (main only) ────────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ── PR Diff ───────────────────────────────────────────────────────────────
  diff:
    name: PR Provider Diff
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: base

      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          path: pr

      - name: Show provider diff
        run: |
          echo "### Provider changes in this PR"
          diff -rq --brief base/dist pr/dist || true
          echo ""
          echo "### Manifest diff"
          diff base/manifest.json pr/manifest.json || true
